name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test, vet and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "These files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            echo "Run 'gofmt -w .' and commit the result." >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build CLI
        run: go build ./...

      - name: Install pinned Starship acceptance binary
        run: |
          acceptance_home="$RUNNER_TEMP/dots-starship-home"
          export PATH="$acceptance_home/.local/bin:$PATH"
          go run ./cmd/dots deps install \
            --file dots.yaml \
            --tag starship \
            --tier generic \
            --home "$acceptance_home" \
            --state-root "$RUNNER_TEMP/dots-starship-state" \
            --yes
          echo "$acceptance_home/.local/bin" >> "$GITHUB_PATH"

      - name: Validate rendered Starship prompt
        run: ./configs/starship/test-prompt.sh

      - name: Install Zsh acceptance shell
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zsh

      - name: Validate selected terminal workflow
        run: go test ./internal/cli ./internal/manifest -run 'TestTerminalAtomicTagsSelectRequiredCapabilities|TestTerminalInstalledZshStarshipIntegration|TestRepositoryHerdrConfigsPassInstalledHerdrValidation' -v

      - name: Test
        run: go test ./...
