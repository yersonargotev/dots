name: Bug report
description: Report something that is broken or behaving unexpectedly.
title: "fix: "
labels: ["needs-triage", "bug"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I can reproduce this without writing to my real home dotfiles.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a sandboxed home directory when config files are involved.
      placeholder: |
        1. Run `...`
        2. See `...`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - WSL
        - Other
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: Shell
      placeholder: zsh, bash, fish, etc.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
