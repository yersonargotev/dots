version: 1
profiles:
  default:
    tags:
      - core
entries:
  - source: configs/zsh/zshrc
    target: ~/.zshrc
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: zsh
        brew: zsh
        apt: zsh
        dnf: zsh
        pacman: zsh
      - name: starship
        brew: starship
        apt: starship
        dnf: starship
        pacman: starship
