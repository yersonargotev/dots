    status: current
profiles:
  core:
    description: Core dotfiles and general developer tooling without agent, web, or mobile provisioners.
    status: current
    tags:
      - zsh
      - zimfw
      - git
      - starship
      - tmux
      - herdr
      - zellij
      - atuin
      - neovim
