version: 1
profiles:
  default:
    tags:
      - core
  desktop:
    tags:
      - core
      - desktop
    dependencies:
      - name: Desktop Nerd Font
        brew_cask: font-cascadia-code-nf
        font_match: "CascadiaCodeNF*"
        font_fallback_matches:
          - "CaskaydiaCoveNerdFont*"
  agents:
    tags:
      - core
      - agents
  web:
    tags:
      - core
      - web
    dependencies:
      - name: Playwright CLI
        command: playwright-cli
        brew: playwright-cli
        linux_homebrew: true
  mobile:
    tags:
      - core
      - mobile
  workstation:
    tags:
      - core
      - desktop
      - agents
    dependencies:
      - name: Desktop Nerd Font
        brew_cask: font-cascadia-code-nf
        font_match: "CascadiaCodeNF*"
        font_fallback_matches:
          - "CaskaydiaCoveNerdFont*"
dependencies:
  - tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: Node LTS (fnm)
        commands:
          - fnm
          - node
        brew: fnm
        linux_homebrew: true
        toolchain: node-lts-fnm
      - name: Rust stable (rustup)
        commands:
          - rustup
          - rustc
          - cargo
        brew: rustup
        linux_homebrew: true
        toolchain: rust-stable-rustup
      - name: go
        command: go
        brew: go
        linux_homebrew: true
      - name: uv
        command: uv
        brew: uv
        linux_homebrew: true
        user_local:
          recipe: uv
          version: 0.11.25
          checksums:
            linux_amd64: 1db18b5e76fa645a7f3865773139bdec8e2d46adbdbb35e7410b34fa8015ccd2
            linux_arm64: e0e9d73f74e06a7dcd53910d5962146ab48f0af9c92cc8df33a37baa0121014d
      - name: pnpm
        command: pnpm
        brew: pnpm
        linux_homebrew: true
        user_local:
          recipe: pnpm
          version: 11.9.0
          checksums:
            linux_amd64: 69af6c012a5f12b4460f8e2280368cbe10551ab328516fc5b665f292b5991017
            linux_arm64: ced48cd1bab413bdde54fee686eaa1c98bb50ee47a518c91d1decb5f2578737b
      - name: bun
        command: bun
        brew: bun
        linux_homebrew: true
        user_local:
          recipe: bun
          version: bun-v1.3.14
          checksums:
            linux_amd64: 951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f
            linux_arm64: a27ffb63a8310375836e0d6f668ae17fa8d8d18b88c37c821c65331973a19a3b
  - tags:
      - agents
    os:
      - darwin
      - linux
    dependencies:
      - name: GitHub CLI
        command: gh
        brew: gh
        linux_homebrew: true
