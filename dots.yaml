version: 1
profiles:
  default:
    tags:
      - core
  desktop:
    tags:
      - core
      - desktop
entries:
  - source: configs/zsh/zshrc
    target: ~/.zshrc
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: zsh
        brew: zsh
        apt: zsh
        dnf: zsh
        pacman: zsh
  - source: configs/zsh/zimrc
    target: ~/.zimrc
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: zsh
        brew: zsh
        apt: zsh
        dnf: zsh
        pacman: zsh
  - source: configs/zsh/zshenv
    target: ~/.zshenv
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: zsh
        brew: zsh
        apt: zsh
        dnf: zsh
        pacman: zsh
  - source: configs/git/gitconfig
    target: ~/.gitconfig
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: git
        brew: git
        apt: git
        dnf: git
        pacman: git
  - source: configs/starship/starship.toml
    target: ~/.config/starship.toml
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: starship
        brew: starship
        apt: starship
        dnf: starship
        pacman: starship
  - source: configs/tmux/tmux.conf
    target: ~/.tmux.conf
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: tmux
        brew: tmux
        apt: tmux
        dnf: tmux
        pacman: tmux
  - source: configs/zellij/config.kdl
    target: ~/.config/zellij/config.kdl
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: zellij
        brew: zellij
        apt: zellij
        dnf: zellij
        pacman: zellij
  - source: configs/zellij/layouts/default.kdl
    target: ~/.config/zellij/layouts/default.kdl
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: zellij
        brew: zellij
        apt: zellij
        dnf: zellij
        pacman: zellij
  - source: configs/ghostty/config.ghostty
    target: ~/.config/ghostty/config.ghostty
    strategy: symlink
    tags:
      - desktop
    os:
      - darwin
      - linux
    dependencies:
      - name: ghostty
        command: ghostty
        brew: ghostty
  - source: configs/atuin/config.toml
    target: ~/.config/atuin/config.toml
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: atuin
        command: atuin
        brew: atuin
  - source: configs/atuin/themes/catppuccin-mocha.toml
    target: ~/.config/atuin/themes/catppuccin-mocha.toml
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: atuin
        command: atuin
        brew: atuin
  - source: configs/bat/config
    target: ~/.config/bat/config
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: bat
        command: bat
        brew: bat
        apt: bat
        dnf: bat
        pacman: bat
  - source: configs/nvim
    target: ~/.config/nvim
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: neovim
        command: nvim
        brew: neovim
        apt: neovim
        dnf: neovim
        pacman: neovim
  - source: configs/claude/settings.json
    target: ~/.claude/settings.json
    strategy: copy
    tags:
      - core
    os:
      - darwin
      - linux
  - source: configs/claude/statusline-command.sh
    target: ~/.claude/statusline-command.sh
    strategy: copy
    tags:
      - core
    os:
      - darwin
      - linux
provisioners:
  - tool: gentle-ai
    tags:
      - core
    spec:
      scope: global
      channel: stable
      persona: neutral
      sdd-mode: multi
      agents:
        - codex
        - claude-code
    dependencies:
      - name: gentle-ai
        command: gentle-ai
        brew: gentleman-programming/tap/gentle-ai
      - name: engram
        command: engram
        brew: gentleman-programming/tap/engram
