      - lazygit
      - eza
      - ripgrep
      - delta
      - fd
      - gh
      - jq
  desktop:
    description: Desktop-only configuration and integrations; compose with core when core dotfiles are desired too.
    status: current
    tags:
      - desktop
      - codexbar
  agents:
    description: Native configuration for Codex, Claude Code, OpenCode, Antigravity, and Copilot CLI.
