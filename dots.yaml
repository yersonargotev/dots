    target: ~/.config/dots/adaptive-theme
    strategy: symlink
    tags:
      - adaptive-theme
    os:
      - darwin
      - linux
  - source: configs/starship/starship.toml
    source_overrides:
      theme-carbonfox: configs/starship/starship-carbonfox.toml
    target: ~/.config/starship.toml
    strategy: symlink
    tags:
      - starship
    os:
      - darwin
      - linux
    dependencies:
      - name: starship
        brew: starship
        linux_homebrew: true
        dnf: starship
        pacman: starship
        user_local:
          recipe: starship
          version: v1.25.1
          checksums:
            linux_amd64: 4488c11ca632327d1f1f16fb2f102c0646094c35479cd5435991385da43c61ac
            linux_arm64: 01517aab398959ea9ea73bdb4f032ea4dbb51dff5c8e5eb05b4a1b9b7ab872b8
  - source: configs/herdr/config.toml
    source_overrides:
      theme-carbonfox: configs/herdr/config-carbonfox.toml
      adaptive-theme: configs/herdr/config-adaptive.toml
    target: ~/.config/herdr/config.toml
    strategy: copy
    ownership: toml-subset
    tags:
      - herdr
    os:
      - darwin
    dependencies:
      - name: herdr
        command: herdr
        brew: herdr
  - source: configs/herdr/plugins/tabby.toml
    target: ~/.config/herdr/plugins/config/yersonargotev.tabby/config.toml
    strategy: copy
    ownership: toml-subset
    tags:
      - herdr
    os:
      - darwin
  - source: configs/herdr/status.sh
    target: ~/.config/herdr/status.sh
    strategy: copy
    tags:
      - herdr-metrics
    os:
      - darwin
  - source: configs/rex/init.lua
    target: ~/.config/rex/init.lua
    strategy: copy
    tags:
      - rex
    os:
      - darwin
      - linux
    dependencies:
      - name: rex
        command: rex
        darwin_app: Rex Beta.app
        requirement: optional
        manual: >-
          Install Rex manually from https://www.superlogical.com/rex/ to use
          the managed configuration. dots manages the configuration and theme
          even when Rex is absent; dots does not install Rex.
  - source: configs/rex/themes/Catppuccin Mocha Blue.ghostty
    target: ~/.config/rex/themes/Catppuccin Mocha Blue.ghostty
    strategy: copy
    tags:
      - rex
    os:
      - darwin
      - linux
  - source: configs/ghostty/config.ghostty
    source_overrides:
      theme-carbonfox: configs/ghostty/config-carbonfox.ghostty
    target: ~/.config/ghostty/config.ghostty
    strategy: symlink
    tags:
      - ghostty
    os:
      - darwin
      - linux
    dependencies:
      - name: ghostty
        command: ghostty
        darwin_app: Ghostty.app
        manual_debian: >-
          Install Ghostty from https://ghostty.org/docs/install/binary. On Ubuntu,
          use the community .deb installer from ghostty-ubuntu with /bin/bash -c
          "$(curl -fsSL https://raw.githubusercontent.com/mkasberg/ghostty-ubuntu/HEAD/install.sh)",
          or run snap install ghostty --classic; this requires sudo/password
          interactivity. After installation, verify ghostty --version and rerun
          dots deps check.
        brew_cask: ghostty
  - source: configs/ghostty/adaptive/adaptive-theme.ghostty
    target: ~/.config/ghostty/adaptive-theme.ghostty
    strategy: symlink
    tags:
      - adaptive-theme
    os:
      - darwin
  - source: configs/atuin/config.toml
