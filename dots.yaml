version: 1
profiles:
  default:
    tags:
      - core
  desktop:
    tags:
      - core
      - desktop
    dependencies:
      - name: Desktop Nerd Font
        brew_cask: font-cascadia-code-nf
        font_match: "CascadiaCodeNF*"
  agents:
    tags:
      - core
      - agents
  workstation:
    tags:
      - core
      - desktop
      - agents
    dependencies:
      - name: Desktop Nerd Font
        brew_cask: font-cascadia-code-nf
        font_match: "CascadiaCodeNF*"
entries:
  - source: configs/zsh/zshrc
    target: ~/.zshrc
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: zsh
        brew: zsh
        apt: zsh
        dnf: zsh
        pacman: zsh
  - source: configs/zsh/zimrc
    target: ~/.zimrc
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: zsh
        brew: zsh
        apt: zsh
        dnf: zsh
        pacman: zsh
  - source: configs/zsh/zshenv
    target: ~/.zshenv
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: zsh
        brew: zsh
        apt: zsh
        dnf: zsh
        pacman: zsh
  - source: configs/git/gitconfig
    target: ~/.gitconfig
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: git
        brew: git
        apt: git
        dnf: git
        pacman: git
  - source: configs/starship/starship.toml
    target: ~/.config/starship.toml
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: starship
        brew: starship
        apt: starship
        dnf: starship
        pacman: starship
  - source: configs/tmux/tmux.conf
    target: ~/.tmux.conf
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: tmux
        brew: tmux
        apt: tmux
        dnf: tmux
        pacman: tmux
  - source: configs/zellij/config.kdl
    target: ~/.config/zellij/config.kdl
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: zellij
        brew: zellij
        apt: zellij
        dnf: zellij
        pacman: zellij
  - source: configs/zellij/layouts/default.kdl
    target: ~/.config/zellij/layouts/default.kdl
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: zellij
        brew: zellij
        apt: zellij
        dnf: zellij
        pacman: zellij
  - source: configs/ghostty/config.ghostty
    target: ~/.config/ghostty/config.ghostty
    strategy: symlink
    tags:
      - desktop
    os:
      - darwin
      - linux
    dependencies:
      - name: ghostty
        command: ghostty
        brew: ghostty
  - source: configs/warp/settings.toml
    target: ~/.warp/settings.toml
    strategy: copy
    tags:
      - desktop
    os:
      - darwin
  - source: configs/warp/keybindings.yaml
    target: ~/.warp/keybindings.yaml
    strategy: copy
    tags:
      - desktop
    os:
      - darwin
  - source: configs/warp/settings.toml
    target: ~/.config/warp-terminal/settings.toml
    strategy: copy
    tags:
      - desktop
    os:
      - linux
    dependencies:
      - name: Warp
        command: warp-terminal
  - source: configs/warp/keybindings.yaml
    target: ~/.config/warp-terminal/keybindings.yaml
    strategy: copy
    tags:
      - desktop
    os:
      - linux
    dependencies:
      - name: Warp
        command: warp-terminal
  - source: configs/atuin/config.toml
    target: ~/.config/atuin/config.toml
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: atuin
        command: atuin
        brew: atuin
  - source: configs/atuin/themes/catppuccin-mocha.toml
    target: ~/.config/atuin/themes/catppuccin-mocha.toml
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: atuin
        command: atuin
        brew: atuin
  - source: configs/bat/config
    target: ~/.config/bat/config
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: bat
        command: bat
        brew: bat
        apt: bat
        dnf: bat
        pacman: bat
  - source: configs/nvim
    target: ~/.config/nvim
    strategy: symlink
    tags:
      - core
    os:
      - darwin
      - linux
    dependencies:
      - name: neovim
        command: nvim
        brew: neovim
        apt: neovim
        dnf: neovim
        pacman: neovim
  - source: configs/zed/settings.json
    target: ~/.config/zed/settings.json
    strategy: symlink
    tags:
      - desktop
    os:
      - darwin
      - linux
    dependencies:
      - name: zed
        command: zed
        brew: zed
  - source: configs/zed/keymap.json
    target: ~/.config/zed/keymap.json
    strategy: symlink
    tags:
      - desktop
    os:
      - darwin
      - linux
    dependencies:
      - name: zed
        command: zed
        brew: zed
  - source: configs/zed/themes/catppuccin-blue.json
    target: ~/.config/zed/themes/catppuccin-blue.json
    strategy: symlink
    tags:
      - desktop
    os:
      - darwin
      - linux
    dependencies:
      - name: zed
        command: zed
        brew: zed
  - source: configs/claude/settings.json
    target: ~/.claude/settings.json
    strategy: copy
    ownership: json-subset
    tags:
      - core
    os:
      - darwin
      - linux
  - source: configs/claude/statusline-command.sh
    target: ~/.claude/statusline-command.sh
    strategy: copy
    tags:
      - core
    os:
      - darwin
      - linux
  # OpenCode has no MCP install CLI and its global opencode.json is co-owned by
  # gentle-ai, so dots owns a separate fragment that OpenCode merges (not
  # replaces) via the OPENCODE_CONFIG env var set in zshenv. This keeps the
  # chrome-devtools MCP server out of gentle-ai's file.
  - source: configs/opencode/mcp.json
    target: ~/.config/opencode-dots.json
    strategy: symlink
    tags:
      - desktop
    os:
      - darwin
      - linux
    dependencies:
      - name: opencode
        command: opencode
provisioners:
  - tool: gentle-ai
    tags:
      - agents
    spec:
      action: uninstall
      agents:
        - codex
        - claude-code
        - opencode
        - antigravity
      components:
        - sdd
      yes: true
    dependencies:
      - name: gentle-ai
        command: gentle-ai
        brew: gentleman-programming/tap/gentle-ai
  - tool: gentle-ai
    tags:
      - agents
    spec:
      scope: global
      channel: stable
      persona: neutral
      preset: custom
      agents:
        - codex
      components:
        - engram
        - context7
        - persona
    dependencies:
      - name: gentle-ai
        command: gentle-ai
        brew: gentleman-programming/tap/gentle-ai
      - name: engram
        command: engram
        brew: gentleman-programming/tap/engram
  - tool: gentle-ai
    tags:
      - agents
    spec:
      scope: global
      channel: stable
      persona: neutral
      preset: custom
      agents:
        - claude-code
      components:
        - engram
        - context7
        - persona
        - permissions
    dependencies:
      - name: gentle-ai
        command: gentle-ai
        brew: gentleman-programming/tap/gentle-ai
      - name: engram
        command: engram
        brew: gentleman-programming/tap/engram
  - tool: gentle-ai
    tags:
      - agents
    spec:
      scope: global
      channel: stable
      persona: neutral
      preset: custom
      agents:
        - antigravity
      components:
        - engram
        - context7
        - persona
    dependencies:
      - name: gentle-ai
        command: gentle-ai
        brew: gentleman-programming/tap/gentle-ai
      - name: engram
        command: engram
        brew: gentleman-programming/tap/engram
  - tool: skills
    tags:
      - agents
    spec:
      package: vercel-labs/agent-skills
      agents:
        - codex
        - claude-code
        - antigravity
      skills:
        - web-design-guidelines
      global: true
    dependencies:
      - name: npx
        command: npx
  - tool: claude
    tags:
      - desktop
    os:
      - darwin
      - linux
    spec:
      marketplace: ChromeDevTools/chrome-devtools-mcp
    dependencies:
      - name: claude
        command: claude
  - tool: claude
    tags:
      - desktop
    os:
      - darwin
      - linux
    spec:
      plugin: chrome-devtools-mcp
      from: chrome-devtools-plugins
    dependencies:
      - name: claude
        command: claude
  - tool: codex
    tags:
      - desktop
    os:
      - darwin
      - linux
    spec:
      mcp: chrome-devtools
      command:
        - npx
        - -y
        - chrome-devtools-mcp@latest
        - --no-performance-crux
      env:
        CHROME_DEVTOOLS_MCP_NO_UPDATE_CHECKS: "1"
        CHROME_DEVTOOLS_MCP_NO_USAGE_STATISTICS: "1"
    dependencies:
      - name: codex
        command: codex
  - tool: codex
    tags:
      - desktop
    os:
      - darwin
      - linux
    spec:
      mcp: codegraph
      command:
        - codegraph
        - serve
        - --mcp
    dependencies:
      - name: codex
        command: codex
      - name: codegraph
        command: codegraph
