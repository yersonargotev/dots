dependencies:
  - tags:
      - ghostty
    os:
      - darwin
      - linux
    dependencies:
      - name: Desktop Nerd Font
        brew_cask: font-cascadia-code-nf
        font_match: "CascadiaCodeNF*"
        font_fallback_matches:
          - "CaskaydiaCoveNerdFont*"
  - tags:
      - codexbar
    os:
      - darwin
    dependencies:
      - name: CodexBar
        darwin_app: CodexBar.app
        brew_cask: codexbar
  - tags:
      - node
    os:
      - darwin
      - linux
    dependencies:
      - name: Node LTS (fnm)
        commands:
          - fnm
          - node
        brew: fnm
        linux_homebrew: true
        toolchain: node-lts-fnm
  - tags:
      - rust
    os:
      - darwin
      - linux
    dependencies:
