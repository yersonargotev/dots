          version: v18.16.1
          checksums:
            linux_amd64: 5c41e20c0130ac84fa4bfa42c19bb55a07855838506063caad0d2922593b39be
            linux_arm64: 9b2b7b41c3587533964ec5ab204b5116200bda39d534619387bcf4f197739b47
