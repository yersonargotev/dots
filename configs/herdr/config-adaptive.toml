# dots-managed Herdr config.
# Adaptive variant selected only by dots' adaptive-theme tag.
# Herdr switches its own UI between Catppuccin Latte and Mocha using its
# native host-terminal light/dark appearance detection. Herdr does not expose a
# dots-owned include seam, so keep non-theme sections synchronized with
# configs/herdr/config.toml; the manifest test guards that invariant.
onboarding = false

[update]
channel = "stable"
version_check = true
manifest_check = true

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[theme]
name = "catppuccin"
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

[ui]
confirm_close = true
prompt_new_tab_name = true
mouse_capture = true
pane_borders = true
pane_gaps = true

[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = true

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", { token = "workspace", fg = "#89b4fa", bold = true }],
  [{ token = "branch", fg = "#6c7086", dim = true }, "git_status"],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", { token = "agent", fg = "#cba6f7", bold = true }, "state_text"],
  [{ token = "workspace", fg = "#6c7086" }, "tab"],
]

[keys]
prefix = "ctrl+a"

# Session/workspace
# Keep Herdr's default detach plus dots' tmux/Zellij capital-D muscle memory.
detach = ["prefix+q", "prefix+shift+d"]
workspace_picker = "prefix+w"
goto = "prefix+g"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+alt+d"
# Keep workspace cycling behind prefix: many terminals collapse Ctrl+Alt+Shift+j/k
# to Ctrl+Alt+j/k, which conflicts with the direct pane-focus bindings below.
previous_workspace = "prefix+alt+k"
next_workspace = "prefix+alt+j"
previous_agent = "prefix+alt+h"
next_agent = "prefix+alt+l"
toggle_sidebar = "prefix+b"

# Tabs: prefix-first tmux-like core plus explicit direct tab navigation.
new_tab = "prefix+c"
rename_tab = ["prefix+shift+t", "prefix+comma"]
previous_tab = ["prefix+p", "ctrl+alt+["]
next_tab = ["prefix+n", "ctrl+alt+]"]
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+x"

# Panes: mirror dots tmux/Zellij intent and add direct pane focus chords.
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
split_vertical = "prefix+v"
split_horizontal = ["prefix+minus", "prefix+d"]
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"
copy_mode = "prefix+["
