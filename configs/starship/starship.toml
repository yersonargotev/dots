# Repository-managed Starship prompt configuration.
#
# This file is fully portable: it assumes only a Nerd Font and contains no
# machine-specific paths, hostnames, or private values. Personal tweaks are made
# by editing your own copy — Starship has no native include mechanism.
# See configs/starship/README.md for the portability classification.

format = """\
($directory)\
$os\
$git_branch\
$git_status\
$fill\
$nodejs\
$rust\
$golang\
$php\
$bun\
$java\
$c\
$conda\
$zig\
$python\
$cmd_duration\
$time\
\n$character\
"""

add_newline = true
command_timeout = 3600000
palette = "catppuccin_mocha"

[fill]
symbol = ' '

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[N](bold red)"
vimcmd_replace_one_symbol = "[R](bold peach)"
vimcmd_visual_symbol = "[V](bold mauve)"

[username]
style_user = 'bold blue'
style_root = 'bold red'
format = '[ $user](fg:$style) '
disabled = false
show_always = true

[directory]
format = "[$path](bold $style)[$read_only]($read_only_style) "
truncation_length = 2
fish_style_pwd_dir_length = 1
style = "fg:blue"
read_only_style = "fg:blue"
before_repo_root_style = "fg:blue"
truncation_symbol = "…/"
truncate_to_repo = false
read_only = "  "

[cmd_duration]
format = " took [$duration]($style) "
style = "bold fg:yellow"
min_time = 500
show_milliseconds = true

[git_branch]
format = "[$symbol$branch]($style) "
style = "bold fg:mauve"
symbol = " "

[git_status]
format = '([$staged$modified$untracked$ahead_behind]($style)) '
style = "bold fg:text"
staged = "[+${count}](fg:green) "
modified = "[!${count}](fg:yellow) "
untracked = "[?${count}](fg:red) "
ahead = "[⇡${count}](fg:teal) "
behind = "[⇣${count}](fg:peach) "
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](fg:mauve) "

[docker_context]
disabled = true
symbol = " "

[python]
disabled = false
format = "[py $version( $virtualenv)](fg:peach) "
symbol = ""
version_format = "$raw"

[java]
format = '[java $version](fg:red) '
version_format = "$raw"
symbol = " "
disabled = false

[c]
format = '[c $version](fg:blue) '
symbol = " "
version_format = "$raw"
disabled = false

[zig]
format = '[zig $version](fg:peach) '
version_format = "$raw"
disabled = false

[bun]
version_format = "$raw"
format = '[bun $version](fg:text) '
disabled = false

[nodejs]
symbol = ""
format = '[node $version](fg:green) '

[rust]
symbol = ""
format = '[rs $version](fg:red) '

[golang]
symbol = ""
format = '[go $version](fg:teal) '

[php]
symbol = ""
format = '[php $version](fg:peach) '

[conda]
symbol = ""
format = '[conda $environment](fg:green) '

[time]
disabled = false
time_format = "%R"
format = '[[   $time ](fg:subtext0)]($style)'
