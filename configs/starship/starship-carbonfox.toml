# Repository-managed Starship prompt configuration.
# Carbonfox palette adapted from EdenEast/nightfox.nvim at revision
# 4dacd3f0185a2227bdf3b6c0975a8f0bf87cac9a (MIT; see configs/themes/LICENSE-nightfox).
#
# This file is fully portable: it assumes only a Nerd Font and contains no
# machine-specific paths, hostnames, or private values. Personal tweaks are made
# by editing your own copy — Starship has no native include mechanism.
# See configs/starship/README.md for the portability classification.

format = """\
($directory)\
$os\
$git_branch\
$git_status\
$fill\
$nodejs\
$rust\
$golang\
$php\
$bun\
$java\
$c\
$conda\
$zig\
$python\
$cmd_duration\
$time\
\n$character\
"""

add_newline = true
command_timeout = 3600000
palette = "carbonfox"

[fill]
symbol = ' '

[palettes.carbonfox]
# Nightfox semantic roles are mapped onto the existing Starship color names so
# every prompt label, icon, layout, and module setting stays unchanged.
rosewater = "#ff91c1"
flamingo = "#ff7eb6"
pink = "#ff91c1"
mauve = "#be95ff"
red = "#ee5396"
maroon = "#ca4780"
peach = "#3ddbd9"
yellow = "#08bdba"
green = "#25be6a"
teal = "#2dc7c4"
sky = "#52bdff"
sapphire = "#33b1ff"
blue = "#78a9ff"
lavender = "#8cb6ff"
text = "#f2f4f8"
subtext1 = "#b6b8bb"
subtext0 = "#7b7c7e"
overlay2 = "#7b7c7e"
overlay1 = "#6e6f70"
overlay0 = "#6e6f70"
surface2 = "#535353"
surface1 = "#353535"
surface0 = "#252525"
base = "#161616"
mantle = "#0c0c0c"
crust = "#0c0c0c"

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[N](bold red)"
vimcmd_replace_one_symbol = "[R](bold peach)"
vimcmd_visual_symbol = "[V](bold mauve)"

[username]
style_user = 'bold blue'
style_root = 'bold red'
format = '[ $user](fg:$style) '
disabled = false
show_always = true

[directory]
format = "[$path](bold $style)[$read_only]($read_only_style) "
truncation_length = 2
fish_style_pwd_dir_length = 1
style = "fg:blue"
read_only_style = "fg:blue"
before_repo_root_style = "fg:blue"
truncation_symbol = "…/"
truncate_to_repo = false
read_only = "  "

[cmd_duration]
format = " took [$duration]($style) "
style = "bold fg:yellow"
min_time = 500
show_milliseconds = true

[git_branch]
format = "[$symbol$branch]($style) "
style = "bold fg:mauve"
symbol = " "

[git_status]
format = '([$staged$modified$untracked$ahead_behind]($style)) '
style = "bold fg:text"
staged = "[+${count}](fg:green) "
modified = "[!${count}](fg:yellow) "
untracked = "[?${count}](fg:red) "
ahead = "[⇡${count}](fg:teal) "
behind = "[⇣${count}](fg:peach) "
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](fg:mauve) "

[docker_context]
disabled = true
symbol = " "

[python]
disabled = false
format = "[py $version( $virtualenv)](fg:peach) "
symbol = ""
version_format = "$raw"

[java]
format = '[java $version](fg:red) '
version_format = "$raw"
symbol = " "
disabled = false

[c]
format = '[c $version](fg:blue) '
symbol = " "
version_format = "$raw"
disabled = false

[zig]
format = '[zig $version](fg:peach) '
version_format = "$raw"
disabled = false

[bun]
version_format = "$raw"
format = '[bun $version](fg:text) '
disabled = false

[nodejs]
symbol = ""
format = '[node $version](fg:green) '

[rust]
symbol = ""
format = '[rs $version](fg:red) '

[golang]
symbol = ""
format = '[go $version](fg:teal) '

[php]
symbol = ""
format = '[php $version](fg:peach) '

[conda]
symbol = ""
format = '[conda $environment](fg:green) '

[time]
disabled = false
time_format = "%R"
format = '[[   $time ](fg:subtext0)]($style)'
